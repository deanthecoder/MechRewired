name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MechRewired.sln

      - name: Build
        run: dotnet build MechRewired.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MechRewired.Tests/MechRewired.Tests.csproj --configuration Release --no-build
